# nginx.conf（任务 6.3A · 打包一次多环境运行）
#
# 配置要点：
#   1. SPA history 回退：try_files $uri $uri/ /index.html，避免刷新子路由 404
#   2. config.js 关缓存：no-cache/no-store/must-revalidate，切环境后浏览器/CDN 不命中旧配置
#      （运行时配置最常见的坑：换 config.js 后浏览器读旧缓存，切环境不生效）
#   3. hash 静态资源长缓存：1 年 immutable，被 hash 的 JS/CSS 全程不变，回滚只需换 config.js
#   4. gzip 压缩：JS/CSS/SVG 等文本资源启用 gzip，减小传输体积
#
# 用途：Docker 镜像里 nginx 的 default.conf（监听 80）。

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩：减小 JS/CSS/SVG 传输体积
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_proxied any;

    # config.js 关缓存（红线）：运行时配置必须每次都拉最新版，切环境后立即生效
    # no-cache: 浏览器可缓存但每次用前需向服务器验证；no-store: 更严格不缓存
    # 这里用 no-cache, no-store, must-revalidate 三重保险，确保切环境后浏览器/CDN 不命中旧 config.js
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # env.js 关缓存（与 config.js 同）：环境标识切换后必须立即生效
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # index.html：不缓存（含脚本引用路径，hash 变化后需立即生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # hash 静态资源：长缓存 1 年 immutable
    # 被_hash 的 JS/CSS 内容变则 hash 变，路径变，旧缓存自然失效；故可长缓存
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA history 回退：未命中静态文件的路径回退到 index.html，由前端路由接管
    # 红线：不配此项刷新子路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
