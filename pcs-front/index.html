<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/logo_tykj.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCS 管理系统</title>
    <style>
      /* 首屏 loading 占位：main.ts 顶层 await loadConfig() 期间显示，mount 后被替换 */
      #app-bootstrap-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #eff2f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #4b5564;
        font-size: 14px;
      }
      #app-bootstrap-loading .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #dddddd;
        border-top-color: #046efc;
        border-radius: 50%;
        animation: app-bootstrap-spin 0.8s linear infinite;
      }
      @keyframes app-bootstrap-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-bootstrap-loading">
        <div class="spinner"></div>
        <div>加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
